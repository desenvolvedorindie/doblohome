services:
  doblo-db:
    image: mysql:8.0
    container_name: doblo-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doblo
      MYSQL_USER: doblo
      MYSQL_PASSWORD: doblo
    ports:
      - "3307:3306"
    volumes:
      - doblo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  doblo-api:
    build: ./backend
    container_name: doblo-api
    depends_on:
      doblo-db:
        condition: service_healthy
    environment:
      DB_DSN: mysql:host=doblo-db;dbname=doblo
      DB_USER: doblo
      DB_PASS: doblo
      MAIL_HOST: doblo-mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@doblo.local
      APP_FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      YII_DEBUG: "1"
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html

  doblo-mailpit:
    image: axllent/mailpit
    container_name: doblo-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  doblo-db-data:
